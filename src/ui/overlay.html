<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:; style-src 'self' 'unsafe-inline'"><title>CLFED Capture</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:15px/1.3 "Segoe UI",Tahoma,Arial,sans-serif;user-select:none}
#card{position:absolute;inset:6px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#28241f;border:1px solid #40392f;border-radius:12px;color:#f4efe8;opacity:0;transform:translateX(24px);transition:opacity .2s,transform .2s}
#card.on{opacity:1;transform:none}
#mark{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:#3d3125;color:#f4b678}
#mark.rec{color:#f0857a}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
b{display:block;font-weight:600}small{display:block;color:#b2a798;font-size:12px}
</style></head>
<body><div id="card"><span id="mark"></span><div><b id="title"></b><small dir="ltr">CLFED Capture</small></div></div>
<script src="overlay.js"></script></body></html>
