<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; media-src file:; style-src 'self' 'unsafe-inline'">
<title>CLFED Capture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand"><img src="logo.png" alt=""><span dir="ltr">CLFED Capture</span></div>
  <nav>
    <button class="tab active" data-page="home"><span data-t="navHome"></span></button>
    <button class="tab" data-page="clips"><span data-t="navClips"></span><span id="clipCount"></span></button>
    <button class="tab" data-page="capture"><span data-t="navCapture"></span></button>
    <button class="tab" data-page="audio"><span data-t="navAudio"></span></button>
    <button class="tab" data-page="hotkeys"><span data-t="navHotkeys"></span></button>
    <button class="tab" data-page="general"><span data-t="navGeneral"></span></button>
  </nav>
  <div class="signature"><span data-t="madeBy"></span> <b dir="ltr" id="author"></b></div>
  <div class="lang"><button data-lang="ar">عربي</button><button data-lang="en">English</button></div>
</header>
<main>
  <div id="updateBar" hidden><span id="updateText"></span><button type="button" id="installUpdate" data-t="updateNow"></button></div>
  <section id="home" class="page active">
    <div class="finder"><span class="lamp"><i id="dot"></i></span><span id="statusText"></span><small data-t="homeHint"></small></div>
    <div class="deck">
      <button id="saveReplay" class="key hero"><span data-t="saveReplay"></span><kbd dir="ltr" id="kbdSave"></kbd></button>
      <button id="toggleRecord" class="key"><span id="recordLabel"></span><kbd dir="ltr" id="kbdRecord"></kbd></button>
      <button id="screenshot" class="key"><span data-t="screenshot"></span><kbd dir="ltr" id="kbdShot"></kbd></button>
      <button id="toggleReplay" class="key" role="switch"><span class="cardHead"><span data-t="instantReplay"></span><span class="pill"><b id="replayState"></b><i></i></span></span><small id="replayLength"></small></button>
    </div>
    <div class="timing">
      <div>
        <div class="meterHead"><span data-t="recordTime"></span><output id="recordValue"></output></div>
        <div class="slider"><button id="recordDown" type="button" data-title="decrease">−</button><input id="recordSlider" type="range" min="0" step="1"><button id="recordUp" type="button" data-title="increase">+</button></div>
        <label class="check"><input id="recordUnlimited" type="checkbox"><span data-t="noLimit"></span></label>
      </div>
      <div>
        <div class="meterHead"><span data-t="replayTime"></span><output id="replayValue"></output></div>
        <div class="slider"><button id="replayDown" type="button" data-title="decrease">−</button><input id="replaySlider" type="range" min="0" step="1"><button id="replayUp" type="button" data-title="increase">+</button></div>
      </div>
      <div class="schedule">
        <label><span data-t="startAt"></span><input id="startAt" type="time" dir="ltr"></label>
        <button id="clearSchedule" type="button" hidden data-t="cancelSchedule"></button>
      </div>
    </div>
    <h2 data-t="recent"></h2>
    <div id="recent" class="recent"></div>
  </section>
  <section id="clips" class="page">
    <h1 data-t="navClips"></h1><p id="clipSummary"></p>
    <div class="library">
      <div id="clipList" class="list"></div>
      <div id="viewer" class="viewer"></div>
    </div>
  </section>
  <section id="capture" class="page">
    <h1 data-t="navCapture"></h1>
    <div class="modes">
      <button type="button" class="mode" data-mode="screen"><span data-t="modeScreen"></span></button>
      <button type="button" class="mode" data-mode="window"><span data-t="modeApps"></span></button>
      <button type="button" class="mode" data-mode="games"><span data-t="modeGames"></span></button>
    </div>
    <form class="settings-form">
      <div class="group">
        <h3 data-t="whatToCapture"></h3>
        <label class="setting" id="monitorRow"><span data-t="monitor"></span><select id="monitor"></select></label>
        <label class="setting" id="windowRow" hidden><span data-t="appWindow"></span><span class="folder"><select id="windowName"></select><button type="button" id="refreshWindows" data-t="refresh"></button></span></label>
        <label class="setting"><span data-t="resolution"></span><select id="resolution"><option value="720">720p (1280×720)</option><option value="1080">1080p (1920×1080)</option><option value="2k">2K (2048×1080)</option><option value="1440">1440p (2560×1440)</option></select></label>
        <label class="setting"><span data-t="fps"></span><select id="fps"><option>30</option><option>60</option></select></label>
        <label class="setting"><span data-t="showRecordTimer"></span><input id="showRecordTimer" type="checkbox"></label>
      </div>
      <div class="group">
        <h3 data-t="instantReplay"></h3>
        <label class="setting"><span data-t="instantReplay"></span><input id="autoReplay" type="checkbox"></label>
        <label class="setting" id="gamingRow"><span data-t="onlyGaming"></span><input id="onlyGaming" type="checkbox"></label>
        <label class="setting stack"><span data-t="extraGames"></span><input id="customGames" dir="ltr" placeholder="MyGame.exe, Other.exe"></label>
        <p class="note" data-t="gamesHint"></p>
      </div>
      <div class="savebar"><button type="submit" class="primary" data-t="save"></button></div>
    </form>
  </section>
  <section id="audio" class="page">
    <h1 data-t="navAudio"></h1>
    <div class="modes">
      <button type="button" class="mode" data-audio="separate"><span data-t="separateSources"></span><small data-t="separateHint"></small></button>
      <button type="button" class="mode" data-audio="together"><span data-t="togetherSources"></span><small data-t="togetherHint"></small></button>
    </div>
    <div class="mixer">
      <div class="strip" id="systemGroup"><div class="stripHead"><b data-t="systemSound"></b><input id="systemOn" type="checkbox"></div><input data-volume="system" type="range" min="0" max="200" step="5" dir="ltr"><output></output></div>
      <div class="strip" id="discordGroup"><div class="stripHead"><b data-t="discordSound"></b></div><input data-volume="discord" type="range" min="0" max="200" step="5" dir="ltr"><output></output></div>
      <div class="strip" id="appsGroup"><div class="stripHead"><b data-t="appsSound"></b></div><input data-volume="apps" type="range" min="0" max="200" step="5" dir="ltr"><output></output></div>
      <div class="strip" id="micGroup"><div class="stripHead"><b data-t="microphone"></b><input id="mic" type="checkbox"></div><input data-volume="mic" type="range" min="0" max="200" step="5" dir="ltr"><output></output><select id="micDevice" aria-label="Microphone"></select></div>
    </div>
  </section>
  <section id="hotkeys" class="page">
    <h1 data-t="navHotkeys"></h1><p data-t="hotkeyHint"></p>
    <div class="group">
      <h3 data-t="navHotkeys"></h3>
      <div class="setting"><span data-t="saveReplay"></span><button type="button" class="bind" data-hotkey="saveReplay" dir="ltr"></button></div>
      <div class="setting"><span data-t="startRecord"></span><button type="button" class="bind" data-hotkey="toggleRecord" dir="ltr"></button></div>
      <div class="setting"><span data-t="screenshot"></span><button type="button" class="bind" data-hotkey="screenshot" dir="ltr"></button></div>
    </div>
    <button type="button" id="resetHotkeys" class="plain" data-t="resetDefaults"></button>
  </section>
  <section id="general" class="page">
    <h1 data-t="navGeneral"></h1>
    <form class="settings-form">
      <div class="group">
        <h3 data-t="navGeneral"></h3>
        <label class="setting"><span data-t="startWithPc"></span><input id="openAtLogin" type="checkbox"></label>
        <label class="setting stack"><span data-t="folder"></span><span class="folder"><input id="clipsFolder" readonly dir="ltr"><button type="button" id="pickFolder" data-t="change"></button></span></label>
        <label class="setting"><span data-t="storage"></span><input id="storageLimitGB" type="number" min="0" step="1"></label>
      </div>
      <div class="savebar"><button type="submit" class="primary" data-t="save"></button></div>
    </form>
    <p class="about" id="about"></p>
  </section>
</main>
<div id="toast" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
